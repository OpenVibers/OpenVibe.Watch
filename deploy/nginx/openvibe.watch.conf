## ═══════════════════════════════════════════════════════════════
## openvibe.watch — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.watch.conf — keep them in sync,
## and reload nginx after changing it. Install: README "Public host".
##
## Watch is an internal service: it holds what people and agents watch and when their conditions
## fired. The public host answers only:
##   /                  a short page saying what the service is (HTML for browsers, text otherwise)
##   /api/health, /api/ready, /release.json
##   /robots.txt        disallow everything
## and keeps the rest off the public edge:
##   /api/v1/*          service-to-service API (bearer token, one capability per route): loopback
##                      only. Services on this host call 127.0.0.1:4730 directly.
##   /internal/hooks/*  webhook deliveries (plan T18 step 5): not exposed yet; when the carrier
##                      lands it goes here with its own signature check and no /api/v1 reach.
##   /metrics           404 here; Prometheus text for direct loopback callers of 127.0.0.1:4730
##   anything else      a JSON 404 that says why, so the name never falls through to another site
## ═══════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.watch;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.watch$request_uri; }
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.watch;

    # The host has the openvibe.network wildcard certificate, not a per-name one.
    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.watch.access.log;
    error_log  /var/log/nginx/openvibe.watch.error.log;

    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Client address only from $remote_addr (realip has already replaced it with the visitor's
    # address for Cloudflare's ranges); never append to or pass through a client-sent header.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/health   { proxy_pass http://127.0.0.1:4730; }
    location = /api/ready    { proxy_pass http://127.0.0.1:4730; }
    location = /release.json { proxy_pass http://127.0.0.1:4730; }

    # Metrics are for host-local scrapers only (http://127.0.0.1:4730/metrics).
    location = /metrics { return 404; }

    location = / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:4730;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ── Service API: loopback only (see header) ─────────────
    location ^~ /api/v1/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:4730;
    }

    # ── Anything else: an honest JSON 404, never another site ──
    location / {
        default_type application/problem+json;
        return 404 '{"type":"about:blank","title":"Not Found","status":404,"code":"watch.not_found","detail":"openvibe.watch is an internal service of the OpenVibe network with no public pages or API. Its API is for OpenVibe services and their signed-in people on the host. About: https://openvibe.watch/ and https://github.com/OpenVibers/OpenVibe.Watch"}';
    }
}

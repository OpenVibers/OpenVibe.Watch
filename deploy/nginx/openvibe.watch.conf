## ═══════════════════════════════════════════════════════════════
## openvibe.watch — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.watch.conf — keep them in sync,
## and reload nginx after changing it. Install: README "Public host".
##
## Watch now has a public site, server-rendered by the Node app (port 4730, systemd unit
## openvibe-watch). The vhost serves:
##   /, /watches, /watches/:id, /how-it-works, /updates      the pages
##   /auth/*                                                  sign-in with OpenVibe.Network
##   /css/*, /shared/*                                        the stylesheet and the Frame assets
##   /robots.txt, /sitemap.xml, /llms.txt, /llms-full.txt     crawl artifacts
##   /api/health, /api/ready, /release.json                   health and release metadata
## and keeps the service API off the public edge:
##   /api/v1/*          service-to-service API (bearer token, one capability per route): loopback
##                      only. Services on this host call 127.0.0.1:4730 directly.
##   /internal/hooks/*  webhook deliveries (plan T18 step 5): not exposed yet; when the carrier
##                      lands it goes here with its own signature check and no /api/v1 reach.
##   /metrics           404 here; Prometheus text for direct loopback callers of 127.0.0.1:4730
##
## Sign-in and form writes are limited per client address. nginx refuses limit_req inside
## limit_except, so a read is exempted with a map on $request_method to an empty key: nginx
## does not count an empty key, and a GET/HEAD page keeps the ordinary page budget.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=watch_pages:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=watch_auth:10m rate=10r/m;

map $request_method $watch_form_key {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
}
limit_req_zone $watch_form_key zone=watch_forms:10m rate=1r/s;

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.watch www.openvibe.watch;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.watch$request_uri; }
}

# ── www → apex ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.watch;
    ssl_certificate     /etc/letsencrypt/live/openvibe.watch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.watch/privkey.pem;
    return 301 https://openvibe.watch$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.watch;

    # openvibe.watch has its own certificate (the openvibe.network one does not cover this name: Cloudflare answers 526).
    include snippets/security-txt.conf;   # /.well-known/security.txt (host file; SECURITY.md in every repo)
    ssl_certificate     /etc/letsencrypt/live/openvibe.watch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.watch/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.watch.access.log;
    error_log  /var/log/nginx/openvibe.watch.error.log;

    client_max_body_size 256k;

    # The app decides robots per page (the person pages are noindex; the home page is not).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    # Client address only from $remote_addr (realip has already replaced it with the visitor's
    # address for Cloudflare's ranges); never append to or pass through a client-sent header.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Health, readiness and release metadata ──────────────
    location = /api/health   { proxy_pass http://127.0.0.1:4730; }
    location = /api/ready    { proxy_pass http://127.0.0.1:4730; }
    location = /release.json { proxy_pass http://127.0.0.1:4730; }

    # Metrics are for host-local scrapers only (http://127.0.0.1:4730/metrics). Case-insensitive so
    # /Metrics and friends are refused the same way.
    location ~* ^/metrics(/|$) { return 404; }
    # OpenVibe.Services reads the resource index on loopback (127.0.0.1:4730) with a service token.
    # A ^~ prefix: the `^~ /api/v1/` block below stops regex matching, so a regex here would never run.
    location ^~ /api/v1/resources { return 404; }

    # ── Sign-in: the network's own budget. /auth/me is the navbar's session probe and gets the
    #    page budget instead, because it runs on every page view. ──
    location = /auth/me {
        limit_req zone=watch_pages burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4730;
    }
    location ^~ /auth/ {
        limit_req zone=watch_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4730;
    }

    # ── The site's own assets (content-hashed ?v=) and the OpenVibe Frame ──
    location ^~ /css/    { proxy_pass http://127.0.0.1:4730; }
    location ^~ /shared/ { proxy_pass http://127.0.0.1:4730; }

    # ── Crawl artifacts ─────────────────────────────────────
    location = /robots.txt     { proxy_pass http://127.0.0.1:4730; }
    location = /sitemap.xml    { proxy_pass http://127.0.0.1:4730; }
    location = /llms.txt       { proxy_pass http://127.0.0.1:4730; }
    location = /llms-full.txt  { proxy_pass http://127.0.0.1:4730; }

    # ── The watches pages: reads keep the page budget, writes (a POST) the strict form zone. The
    #    map above gives GET/HEAD an empty key, which nginx does not count, so watch_forms only
    #    limits writes; watch_pages limits every read (POSTs count in both, which is fine). ──
    location ^~ /watches {
        limit_req zone=watch_forms burst=10 nodelay;
        limit_req zone=watch_pages burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4730;
    }

    # ── OpenVibe.Events' delivery route: loopback only (POST /internal/events) ──
    # Events posts to http://127.0.0.1:4730/internal/events directly; never proxied from outside (ADR-033).
    # Case-insensitive so /Internal and /internal/events alike are refused.
    location ~* ^/internal(/|$) { return 404; }

    # ── Pages ───────────────────────────────────────────────
    location / {
        limit_req zone=watch_pages burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4730;
    }

    # ── Service API: loopback only (see header) ─────────────
    location ^~ /api/v1/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:4730;
    }

    location ~ /\.(?!well-known) { deny all; }
}
